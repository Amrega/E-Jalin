services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ejalin-app
    restart: unless-stopped
    ports:
      - "8000:80"
    working_dir: /var/www
    volumes:
      - ./:/var/www
      - ./docker/php/local.ini:/usr/local/etc/php/conf.d/local.ini
      - ./docker/apache/000-default.conf:/etc/apache2/sites-available/000-default.conf
    networks:
      - ejalin-net

  db:
    image: mysql:8.0
    container_name: ejalin-db
    restart: unless-stopped
    ports:
      - "3306:3306"
    environment:
      MYSQL_DATABASE: ejalin
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: ejalin
      MYSQL_PASSWORD: password
    volumes:
      - ejalin-dbdata:/var/lib/mysql
    networks:
      - ejalin-net

  redis:
    image: redis:alpine
    container_name: ejalin-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - ejalin-redisdata:/data
    networks:
      - ejalin-net

  phpmyadmin:
    image: phpmyadmin:latest
    container_name: ejalin-phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      UPLOAD_LIMIT: 100M
    depends_on:
      - db
    networks:
      - ejalin-net


networks:
  ejalin-net:
    driver: bridge

volumes:
  ejalin-dbdata:
    driver: local
  ejalin-redisdata:
    driver: local
